name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mars-space-api

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mars
          POSTGRES_PASSWORD: mars
          POSTGRES_DB: mars_space_test
        # 5433 on the host, matching the committed `.env.test`. The e2e suite
        # reads that file with `override: true`, so CI has to meet it there
        # rather than export a competing DATABASE_URL.
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mars -d mars_space_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://mars:mars@localhost:5433/mars_space_test?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mars-space-api/pnpm-lock.yaml

      # --frozen-lockfile is the point: it fails the build when package.json and
      # the lockfile have drifted, which is what silently broke the Docker image.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Lint
        run: pnpm lint:check

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test -- --ci --silent

      # `pretest:e2e` applies the migrations to mars_space_test first.
      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Build
        run: pnpm build

      # A green build that emitted nothing has happened here before (a stale
      # tsbuildinfo outside outDir), so the entrypoint is asserted explicitly.
      - name: Verify the build entrypoint exists
        run: test -f dist/main.js || (echo "::error::pnpm build produced no dist/main.js" && exit 1)

  web:
    name: Web — lint, types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mars-space-web

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: mars-space-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Check translation parity
        run: pnpm i18n:check

      - name: Build
        run: pnpm build

  docker:
    name: API — Docker image builds
    runs-on: ubuntu-latest
    needs: api

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only — the image is not pushed. This catches the class of failure
      # that unit tests cannot: a lockfile the image cannot install from, or a
      # Prisma client that is not where the runtime expects it.
      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: mars-space-api
          push: false
          load: true
          tags: mars-space-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The compose command runs `dist-seed/prisma/seed.js` and then
      # `dist/main.js`; both paths are asserted rather than assumed, because a
      # build-layout change can silently move them and only surface at deploy.
      - name: Assert the image contains its entrypoints
        run: |
          docker run --rm --entrypoint sh mars-space-api:ci -c '
            test -f /app/dist/main.js || { echo "::error::missing /app/dist/main.js"; exit 1; }
            test -f /app/dist-seed/prisma/seed.js || { echo "::error::missing /app/dist-seed/prisma/seed.js"; exit 1; }
            node -e "require(\"@prisma/client\").PrismaClient" || { echo "::error::Prisma client is not generated in the image"; exit 1; }
          '
