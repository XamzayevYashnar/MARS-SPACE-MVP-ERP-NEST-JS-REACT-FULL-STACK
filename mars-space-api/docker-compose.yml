services:
  postgres:
    image: postgres:16-alpine
    container_name: mars-space-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mars}
      # Overridable so a real deployment does not run on the password printed
      # in this file. The `mars` default keeps `compose up` one command locally.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mars}
      POSTGRES_DB: ${POSTGRES_DB:-mars_space}
    ports:
      # Host 5433 keeps the container clear of a locally installed PostgreSQL on 5432.
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-mars} -d ${POSTGRES_DB:-mars_space}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mars-space-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      API_PREFIX: api/v1
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Inside the compose network Postgres is reachable on its own port.
      DATABASE_URL: postgresql://${POSTGRES_USER:-mars}:${POSTGRES_PASSWORD:-mars}@postgres:5432/${POSTGRES_DB:-mars_space}?schema=public
      # No defaults on purpose. This file runs with NODE_ENV=production, and a
      # fallback secret here would be a signing key published in the repository:
      # the config schema rejects exactly these placeholders, so `compose up`
      # would fail at boot with a confusing message instead of at the point the
      # variable was forgotten. `?err` makes compose refuse up front.
      # Generate each with: openssl rand -base64 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env — openssl rand -base64 48}
      JWT_ACCESS_EXPIRES_IN: ${JWT_ACCESS_EXPIRES_IN:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET in .env — must differ from the access secret}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      # Off by default: the docs enumerate every admin route.
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_PATH: ./uploads
      STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-http://localhost:4000/uploads}
      STORAGE_MAX_FILE_SIZE: ${STORAGE_MAX_FILE_SIZE:-5242880}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      THROTTLE_TTL: ${THROTTLE_TTL:-60}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-100}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@marsspace.uz}
      # Same reasoning as the JWT secrets: `ChangeMe123!` as a default would
      # mint a SUPER_ADMIN whose password is printed in this file.
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?set SEED_ADMIN_PASSWORD in .env — 12+ characters}
      SEED_MANAGER_EMAIL: ${SEED_MANAGER_EMAIL:-manager@marsspace.uz}
      SEED_MANAGER_PASSWORD: ${SEED_MANAGER_PASSWORD:?set SEED_MANAGER_PASSWORD in .env — 12+ characters}
      # Fabricated students, leads and testimonials. Never true against a live DB.
      SEED_DEMO: ${SEED_DEMO:-false}
    ports:
      - '4000:4000'
    volumes:
      - uploads-data:/app/uploads
    # Migrate + seed before serving, so `docker compose up` yields a ready API.
    command: sh -c "node node_modules/prisma/build/index.js migrate deploy && node dist-seed/prisma/seed.js && node dist/main.js"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: mars-space-pgadmin
    restart: unless-stopped
    profiles: ['tools']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@marsspace.uz
      PGADMIN_DEFAULT_PASSWORD: mars
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - '5050:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  postgres-data:
  pgadmin-data:
  uploads-data:
